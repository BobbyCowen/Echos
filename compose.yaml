services:
  postgres:
    image: postgres:17-alpine
    container_name: echos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: echos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - echos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d echos']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  echos-postgres-data:
